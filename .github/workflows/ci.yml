name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "refactor/**"
      - "perf/**"
      - "build/**"
      - "ci/**"
      - "style/**"
      - "chore/**"
      - "revert/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-05-18

jobs:
  changes:
    name: Classify changes
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
    outputs:
      docs_changed: ${{ steps.range.outputs.docs_changed }}
      website_changed: ${{ steps.range.outputs.website_changed }}
      code_changed: ${{ steps.range.outputs.code_changed }}
      base_sha: ${{ steps.range.outputs.base_sha }}
      head_sha: ${{ steps.range.outputs.head_sha }}
      verified_run_id: ${{ steps.verified.outputs.verified_run_id }}
      verified_run_url: ${{ steps.verified.outputs.verified_run_url }}
    steps:
      - name: Checkout change range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test CI range resolution
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_ci_change_range.py -v

      - name: Test verified source tree lookup
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_find_verified_ci_run.py -v

      - name: Resolve change range
        id: range
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$GITHUB_SHA"
          fi
          scripts/resolve-ci-change-range.sh "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"

      # A squash merge or fast-forward often reproduces a tree that already
      # passed every native job on its branch; that evidence is reused instead
      # of repeating the same build and tests.
      - name: Find an earlier passing run of the same source tree
        id: verified
        if: steps.range.outputs.code_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/find-verified-ci-run.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --current-run-id "$GITHUB_RUN_ID" \
            --required-job "App Bundle and supply chain" \
            --required-job "Rust lint, release builds, and Swift tests" \
            --required-job "Rust package tests" \
            --required-job "Rust workspace and API contract tests" \
            >> "$GITHUB_OUTPUT"

  docs-quality:
    name: Documentation quality
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout immutable IronMLX commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Verify Conventional Commits
        shell: bash
        run: scripts/verify-conventional-commits.sh "${{ needs.changes.outputs.base_sha }}" "${{ needs.changes.outputs.head_sha }}"

      - name: Verify Markdown links and image paths
        shell: ruby {0}
        run: |
          require "pathname"
          missing = []
          Dir.glob("**/*.md", File::FNM_DOTMATCH)
            .reject { |f| f.start_with?(".git/") || f == ".github/release-notes-template.md" }
            .each do |file|
            File.read(file).scan(/!?(?:\[[^\]]*\])\(([^)]+)\)/).flatten.each do |raw|
              target = raw.split(/[?#]/, 2).first
              next if target.empty? || target =~ %r{\A(?:https?:|mailto:|#)}
              path = Pathname.new(file).dirname.join(target).cleanpath
              missing << "#{file} -> #{target}" unless File.exist?(path.to_s)
            end
          end
          abort "missing links:\n#{missing.join("\n")}" unless missing.empty?
          puts "Markdown links and image paths passed"

      - name: Verify English and Simplified Chinese documentation structure
        run: python3 scripts/verify-documentation-parity.py

  website-quality:
    name: Website quality
    needs: changes
    if: needs.changes.outputs.website_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable IronMLX commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Verify Conventional Commits
        run: scripts/verify-conventional-commits.sh "${{ needs.changes.outputs.base_sha }}" "${{ needs.changes.outputs.head_sha }}"

      - name: Verify supported-model documentation inputs
        run: python3 scripts/build-supported-models-docs.py --check

      - name: Build and test bilingual website
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_website_docs.py -v

      - name: Test release note rendering
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_render_release_notes.py -v

      - name: Preview current stable release summary
        shell: bash
        run: |
          python3 scripts/render-release-notes.py "v$(cat VERSION)" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/ironmlx-release-body.md"

      - name: Protect tracked website inputs
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

  # The native gate runs as four parallel jobs. Each job restores the same
  # cached MLX build; a cache miss rebuilds it from the pinned source.
  bundle:
    name: App Bundle and supply chain
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.verified_run_id == ''
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout immutable IronMLX commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Verify Conventional Commits
        shell: bash
        run: scripts/verify-conventional-commits.sh "${{ needs.changes.outputs.base_sha }}" "${{ needs.changes.outputs.head_sha }}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustc --version --verbose

      - name: Verify product version and publication boundary
        shell: bash
        run: scripts/verify-version-consistency.sh

      - name: Test Dashboard recovery notifications
        run: node --test scripts/tests/test_dashboard_recovery.cjs scripts/tests/test_dashboard_model_parameters.cjs scripts/tests/test_dashboard_log_export.cjs scripts/tests/test_dashboard_download_cleanup.cjs scripts/tests/test_dashboard_supported_models.cjs scripts/tests/test_dashboard_onboarding.cjs scripts/tests/test_chat_render.cjs scripts/tests/test_chat_input.cjs scripts/tests/test_chat_history.cjs scripts/tests/test_chat_math.cjs

      - name: Test crash recovery helper startup
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_backend_crash_helper.py -v

      - name: Test stable release identity gate
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_verify_release_identity.py -v

      - name: Test release note rendering
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_render_release_notes.py -v

      - name: Test release archive round trips
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_release_archives.py -v

      - name: Verify deterministic CycloneDX SBOM
        shell: bash
        run: scripts/verify-sbom.sh

      # Both tools are pinned and built with the pinned toolchain; the cache
      # only avoids recompiling the same versions on every run.
      - name: Restore pinned Rust supply-chain tools
        id: cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ironmlx-ci-tools
          key: cargo-tools-v1-${{ runner.os }}-${{ runner.arch }}-audit-0.22.2-about-0.9.1-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install pinned Rust supply-chain tools
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked --root "$HOME/.ironmlx-ci-tools" --version 0.22.2 cargo-audit
          cargo install --locked --root "$HOME/.ironmlx-ci-tools" --features cli --version 0.9.1 cargo-about

      - name: Verify pinned Rust supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/.ironmlx-ci-tools/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.ironmlx-ci-tools/bin/cargo-audit" audit --version)" = "cargo-audit-audit 0.22.2"
          test "$("$HOME/.ironmlx-ci-tools/bin/cargo-about" --version)" = "cargo-about 0.9.1"

      - name: Audit Rust dependencies for known vulnerabilities
        shell: bash
        run: cargo audit

      - name: Verify license policy and reproducible third-party materials
        shell: bash
        run: python3 scripts/verify-license-policy.py

      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 \
            "$archive" | shasum --algorithm 256 --check
          tar -xzf "$archive" -C "$scanner_dir"
          test "$("$scanner_dir/gitleaks" version)" = "8.30.1"
          echo "GITLEAKS_BIN=$scanner_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Scan tracked source tree for secrets
        shell: bash
        run: scripts/verify-secrets.sh

      - name: Prepare pinned MLX
        uses: ./.github/actions/prepare-mlx

      # The bundle script also regenerates and compares the third-party
      # materials against this MLX source and build.
      - name: Build self-contained Release App Bundle
        shell: bash
        env:
          MLX_SRC: ${{ runner.temp }}/ironmlx-mlx-source
          IRONMLX_REUSE_MLX_BUILD: "1"
        run: scripts/build-app-bundle.sh

      # Same target directory and compiler environment as build-app-bundle.sh,
      # so the release artifacts it built are reused and only the remaining
      # workspace targets are compiled.
      - name: Build every workspace target in Release
        shell: bash
        run: |
          set -euo pipefail
          remap="-ffile-prefix-map=$HOME=. -fdebug-prefix-map=$HOME=."
          env \
            MLX_DIR="$GITHUB_WORKSPACE/.build/app-bundle/mlx-install" \
            MACOSX_DEPLOYMENT_TARGET=26.4 \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.build/app-bundle/cargo-target" \
            CFLAGS="$remap" \
            CXXFLAGS="$remap" \
            RUSTFLAGS="--remap-path-prefix=$HOME=." \
            cargo build --locked --release

      - name: Test stable release failure boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_stable_release.py -v

      - name: Test public update policy and Sparkle signatures
        shell: bash
        run: |
          test -x .build/app-bundle/swift-build/artifacts/sparkle/Sparkle/bin/sign_update
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_app_updates.py -v

      - name: Re-run static Bundle gate and protect tracked sources
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-app-bundle.sh dist/IronMLX.app
          scripts/verify-model-distribution-boundary.sh dist/IronMLX.app
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  rust-gates:
    name: Rust lint, release builds, and Swift tests
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.verified_run_id == ''
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout immutable IronMLX commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install "$RUST_NIGHTLY_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc --version --verbose
          rustc "+$RUST_NIGHTLY_TOOLCHAIN" --version --verbose

      - name: Prepare pinned MLX
        uses: ./.github/actions/prepare-mlx

      - name: Run required Rust gates
        shell: bash
        env:
          MLX_DIR: ${{ github.workspace }}/.build/app-bundle/mlx-install
          MLX_METAL_PATH: ${{ github.workspace }}/.build/app-bundle/mlx-install/lib
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo "+$RUST_NIGHTLY_TOOLCHAIN" fmt --all -- --check
          cargo "+$RUST_NIGHTLY_TOOLCHAIN" clippy --locked --all-features --workspace -- -D warnings
          cargo build --locked --release -p ironmlx-lm -p ironmlx-runtime --features ironmlx-lm/tools,ironmlx-runtime/tools --bins

      - name: Run Swift Release tests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path ironmlx-app \
            --configuration release \
            --scratch-path .build/ci-swift \
            --no-parallel

      - name: Verify standalone speech client transport
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 6 examples/speech-client.swift \
            -o "$RUNNER_TEMP/ironmlx-speech-client"
          IRONMLX_SPEECH_CLIENT="$RUNNER_TEMP/ironmlx-speech-client" \
            python3 -m unittest discover -s scripts/tests -p test_speech_client.py -v

      - name: Protect tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  rust-package-tests:
    name: Rust package tests
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.verified_run_id == ''
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout immutable IronMLX commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustc --version --verbose

      - name: Prepare pinned MLX
        uses: ./.github/actions/prepare-mlx

      # Each crate also passes on its own, without features that other
      # workspace members enable through feature unification.
      - name: Run per-package tests without optional features
        shell: bash
        env:
          # Scheduler unit tests exercise fixed high-capacity fixtures and must
          # not inherit the hosted runner's physical-memory tier.
          IRONMLX_TOTAL_RAM_BYTES: "68719476736"
          MLX_DIR: ${{ github.workspace }}/.build/app-bundle/mlx-install
          MLX_METAL_PATH: ${{ github.workspace }}/.build/app-bundle/mlx-install/lib
        run: |
          set -euo pipefail
          scripts/run-with-test-metallibs.sh bash -euo pipefail -c '
            cargo test --locked -p ironmlx-core --no-default-features -- --test-threads=1
            cargo test --locked -p ironmlx-image --no-default-features -- --test-threads=1
            cargo test --locked -p ironmlx-lm --no-default-features -- --test-threads=1
            cargo test --locked -p ironmlx-runtime --no-default-features -- --test-threads=1
          '

      - name: Protect tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  rust-workspace-tests:
    name: Rust workspace and API contract tests
    needs: changes
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.verified_run_id == ''
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout immutable IronMLX commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustc --version --verbose

      - name: Prepare pinned MLX
        uses: ./.github/actions/prepare-mlx

      - name: Run public API contract tests
        shell: bash
        env:
          # Scheduler unit tests exercise fixed high-capacity fixtures and must
          # not inherit the hosted runner's physical-memory tier.
          IRONMLX_TOTAL_RAM_BYTES: "68719476736"
          MLX_DIR: ${{ github.workspace }}/.build/app-bundle/mlx-install
          MLX_METAL_PATH: ${{ github.workspace }}/.build/app-bundle/mlx-install/lib
        run: |
          set -euo pipefail
          scripts/run-with-test-metallibs.sh bash -euo pipefail -c '
            cargo test --locked --all-features --workspace -- --test-threads=1
            cargo test --locked --all-features \
              --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
              -p ironmlx --lib server::
          '

      - name: Run pinned official SDK contract tests
        shell: bash
        run: |
          set -euo pipefail
          contract_venv="$RUNNER_TEMP/ironmlx-api-contract-sdk"
          python3 -m venv "$contract_venv"
          "$contract_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --requirement scripts/api-contract-sdk/requirements.txt
          "$contract_venv/bin/python" \
            scripts/api-contract-sdk/contract.py \
            --fixture

      - name: Protect tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  # Branch protection requires this check name. It passes when the native jobs
  # passed, when no native input changed, or when the same tree already passed.
  release-quality:
    name: Rust, Swift, MLX, and App Bundle
    needs: [changes, bundle, rust-gates, rust-package-tests, rust-workspace-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native job
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          VERIFIED_RUN_URL: ${{ needs.changes.outputs.verified_run_url }}
          VERIFIED_RUN_ID: ${{ needs.changes.outputs.verified_run_id }}
          NATIVE_RESULTS: >-
            bundle=${{ needs.bundle.result }}
            rust-gates=${{ needs.rust-gates.result }}
            rust-package-tests=${{ needs.rust-package-tests.result }}
            rust-workspace-tests=${{ needs.rust-workspace-tests.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "error: change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "No native inputs changed; native jobs are not required"
            exit 0
          fi
          if [[ -n "$VERIFIED_RUN_ID" ]]; then
            echo "This source tree already passed every native job: $VERIFIED_RUN_URL"
            exit 0
          fi
          status=0
          for entry in $NATIVE_RESULTS; do
            echo "$entry"
            [[ "${entry#*=}" == "success" ]] || status=1
          done
          exit "$status"
