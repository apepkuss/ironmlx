[package]
name = "ironmlx-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Inference runtime and model lifecycle services backed by MLX"
publish = false

[dependencies]
ironmlx-decision = { path = "../ironmlx-decision" }
ironmlx-audio = { path = "../ironmlx-audio" }
ironmlx-image = { path = "../ironmlx-image" }
clap = { version = "4", features = ["derive"], optional = true }
ironmlx-lm = { path = "../ironmlx-lm" }
ironmlx-core = { path = "../ironmlx-core" }
mlx = { path = "../mlx" }
anyhow = "1"
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
dirs = "6"
libc.workspace = true
# Enables pre-harness metallib setup for integration/all-target test builds.
ctor = { version = "1", optional = true }

[features]
default = []
tools = ["dep:clap"]
test-support = ["dep:ctor"]

[dev-dependencies]
ironmlx-lm = { path = "../ironmlx-lm", features = ["test-support"] }
ironmlx-core = { path = "../ironmlx-core", features = ["test-support"] }
approx = "0.5"
serial_test = { version = "3", default-features = false }
# Unit-test builds do not enable crate features, so they need the macro here too.
ctor = "1"

[[bin]]
name = "ironmlx-core-bench"
path = "src/bin/ironmlx-core-bench.rs"
required-features = ["tools"]

[[bin]]
name = "dflash2-q8-q16-qualification"
path = "src/bin/dflash2-q8-q16-qualification.rs"
required-features = ["tools"]

[[bin]]
name = "dflash2-batched-q8-q16-gate"
path = "src/bin/dflash2-batched-q8-q16-gate.rs"
required-features = ["tools"]

[[bin]]
name = "prefill-nll"
path = "src/bin/prefill-nll.rs"
required-features = ["tools"]

[[bin]]
name = "b1-path-qualification"
path = "src/bin/b1-path-qualification.rs"
required-features = ["tools"]

[[bin]]
name = "dflash2-lane-diagnostic"
path = "src/bin/dflash2-lane-diagnostic.rs"
required-features = ["tools"]

[[bin]]
name = "dflash2-tree-batch-diagnostic"
path = "src/bin/dflash2-tree-batch-diagnostic.rs"
required-features = ["tools"]

[[bin]]
name = "dflash2-moe-bench"
path = "src/bin/dflash2-moe-bench.rs"
required-features = ["tools"]

[[bin]]
name = "qwen36-moe-logits-dump"
path = "src/bin/qwen36-moe-logits-dump.rs"
required-features = ["tools"]

[[bin]]
name = "dflash2-ragged-batch-prototype"
path = "src/bin/dflash2-ragged-batch-prototype.rs"
required-features = ["tools"]
