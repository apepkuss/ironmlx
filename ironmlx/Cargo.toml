[package]
name = "ironmlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local LLM inference on Apple Silicon — Rust runtime backed by cxx-mlx"

[[bin]]
name = "ironmlx"
path = "src/main.rs"

[dependencies]
mlx = { path = "../mlx" }
mlx-sys = { path = "../mlx-sys" }
turboquant = { path = "../turboquant" }
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
sha2 = "0.10"
dirs = "6"
anyhow = "1"
smallvec = "1"
minijinja = { version = "2", default-features = false, features = ["builtins", "loader", "macros", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
tokio.workspace = true
axum.workspace = true
axum-server.workspace = true
# CORS / tracing layers deferred to P8b (multi-request scheduler). When P8b
# adds CORS or request-tracing middleware, restore:
#   tower-http.workspace = true
tokio-stream.workspace = true
futures.workspace = true
reqwest.workspace = true
rustls.workspace = true
libc.workspace = true
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[features]
default = []
vision-dump = []

[dev-dependencies]
approx = "0.5"
tokio-stream.workspace = true
# Serializes tests that share global MLX/Metal state (default stream / command
# encoder / first-compile of cached `OnceLock` custom `MetalKernel`s). Without
# this, parallel test threads race on that shared state and intermittently
# corrupt computed values (custom-kernel vs composed-MLX divergence well above
# the numeric tolerance). Tests in the `mlx_metal` group run one-at-a-time.
serial_test = { version = "3", default-features = false }
tower = { version = "0.5", features = ["util"] }
