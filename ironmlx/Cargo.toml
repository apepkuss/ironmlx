[package]
name = "ironmlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local LLM inference on Apple Silicon — Rust runtime backed by cxx-mlx"

[[bin]]
name = "ironmlx"
path = "src/main.rs"

[dependencies]
mlx = { path = "../mlx" }
mlx-sys = { path = "../mlx-sys" }
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
dirs = "6"
anyhow = "1"
smallvec = "1"
minijinja = { version = "2", default-features = false, features = ["builtins", "loader", "macros", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
tokio.workspace = true
axum.workspace = true
# CORS / tracing layers deferred to P8b (multi-request scheduler). When P8b
# adds CORS or request-tracing middleware, restore:
#   tower-http.workspace = true
tokio-stream.workspace = true
futures.workspace = true

[dev-dependencies]
approx = "0.5"
reqwest.workspace = true
tokio-stream.workspace = true
