[package]
name = "ironmlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local LLM inference on Apple Silicon — Rust runtime backed by MLX"
publish = false

[[bin]]
name = "ironmlx"
path = "src/main.rs"

[dependencies]
ironmlx-audio = { path = "../ironmlx-audio" }
ironmlx-runtime = { path = "../ironmlx-runtime" }
ironmlx-lm = { path = "../ironmlx-lm" }
ironmlx-core = { path = "../ironmlx-core" }
ironmlx-decision = { path = "../ironmlx-decision" }
mlx = { path = "../mlx" }
mlx-sys = { path = "../mlx-sys" }
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
sha2 = "0.10"
dirs = "6"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
tokio.workspace = true
axum.workspace = true
axum-server.workspace = true
# CORS / tracing layers deferred to P8b (multi-request scheduler). When P8b
# adds CORS or request-tracing middleware, restore:
#   tower-http.workspace = true
tokio-stream.workspace = true
futures.workspace = true
reqwest.workspace = true
rustls.workspace = true
libc.workspace = true
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[features]
default = []
vision-dump = ["ironmlx-lm/vision-dump"]

[dev-dependencies]
ironmlx-runtime = { path = "../ironmlx-runtime", features = ["test-support"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ironmlx-lm = { path = "../ironmlx-lm", features = ["test-support"] }
ironmlx-core = { path = "../ironmlx-core", features = ["test-support"] }
approx = "0.5"
tokio-stream.workspace = true
# Serializes tests that share global MLX/Metal state (default stream / command
# encoder / first-compile of cached `OnceLock` custom `MetalKernel`s). Without
# this, parallel test threads race on that shared state and intermittently
# corrupt computed values (custom-kernel vs composed-MLX divergence well above
# the numeric tolerance). Tests in the `mlx_metal` group run one-at-a-time.
serial_test = { version = "3", default-features = false }
tower = { version = "0.5", features = ["util"] }
