[package]
name = "ironmlx-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native audio model resources, signal processing, and speech inference contracts"
publish = false

[dependencies]
ironmlx-core = { path = "../ironmlx-core" }
mlx = { path = "../mlx" }
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "mp3"] }

mecab-sys = "=0.1.0"
tiktoken-rs = "0.12"
rustfst = "1.3.1"
fancy-regex = "0.17"
regex = "1"

[dev-dependencies]
tempfile = "3"
